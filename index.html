<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGOMANI — Sharodiyo Bangla Music</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --gold:#ffcc55;
  --red:#e83a2d;
  --bg:#080504;
  --card:#120b08;
}

html,body{
  margin:0;
  padding:0;
  background:#080504;
  color:#fff;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
}

body{
  min-height:100vh;
}

/* CLEAN LIVE DURGA BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("durga-bg.png") center center/cover no-repeat;
  z-index:0;
  animation:durgaMove 18s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:1;
  pointer-events:none;
}

@keyframes durgaMove{
  from{
    transform:scale(1);
  }
  to{
    transform:scale(1.07);
  }
}

/* EVERYTHING ABOVE BACKGROUND */
header,
main,
footer{
  position:relative;
  z-index:5;
}

header{
  position:sticky;
  top:0;
  background:rgba(10,5,3,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,204,85,.25);
  padding:14px 18px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:24px;
  overflow-x:auto;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--gold);
  white-space:nowrap;
}

.nav button{
  border:0;
  background:none;
  color:#fff;
  font-size:16px;
  white-space:nowrap;
  padding:10px;
  cursor:pointer;
}

.nav button.active{
  color:var(--gold);
}

/* MAIN */
main{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 160px;
}

/* HERO */
.hero{
  text-align:center;
  padding:45px 10px 30px;
}

.trishul{
  font-size:55px;
  margin-bottom:5px;
  filter:drop-shadow(0 0 10px #ffcc55);
}

.hero h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:clamp(42px,10vw,82px);
  letter-spacing:5px;
  color:#fff;
  text-shadow:0 4px 25px #000;
}

.hero .bengali{
  margin-top:8px;
  color:var(--gold);
  font-size:25px;
  font-weight:700;
  text-shadow:0 2px 10px #000;
}

.hero p{
  max-width:700px;
  margin:15px auto;
  font-size:18px;
  color:#eee;
  text-shadow:0 2px 8px #000;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.card{
  min-height:180px;
  padding:25px;
  border:1px solid rgba(255,204,85,.28);
  border-radius:22px;
  background:rgba(10,5,3,.78);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.card .emoji{
  font-size:38px;
}

.card h3{
  margin:12px 0 5px;
  font-size:24px;
}

.card p{
  margin:0;
  color:#d8cfc8;
}

.card button{
  margin-top:18px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--gold);
  background:#130c08;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

/* PLAYLIST */
.section{
  margin-top:35px;
  background:rgba(8,5,4,.82);
  border:1px solid rgba(255,204,85,.2);
  border-radius:22px;
  padding:20px;
  backdrop-filter:blur(10px);
}

.section h2{
  margin-top:0;
  color:var(--gold);
}

.song{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  cursor:pointer;
}

.song:last-child{
  border-bottom:0;
}

.song:hover{
  background:rgba(255,204,85,.08);
}

.num{
  width:35px;
  color:#aaa;
}

.song-title{
  font-weight:700;
}

.artist{
  font-size:13px;
  color:#aaa;
  margin-top:3px;
}

/* PLAYER */
.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:rgba(8,5,4,.96);
  border-top:1px solid rgba(255,204,85,.35);
  box-shadow:0 -10px 35px rgba(0,0,0,.6);
  padding:10px 14px;
}

.player-inner{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1.3fr 1fr;
  align-items:center;
  gap:15px;
}

.now{
  min-width:0;
}

.now-title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now-artist{
  color:#aaa;
  font-size:13px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
}

.control{
  width:45px;
  height:45px;
  border-radius:50%;
  border:1px solid rgba(255,204,85,.4);
  background:#1b100b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.control.play{
  width:58px;
  height:58px;
  background:var(--red);
  border-color:var(--red);
  font-size:22px;
}

.volume{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

.volume input{
  width:100px;
}

/* YOUTUBE PLAYER - hidden visually but functional */
.youtube-box{
  position:fixed;
  width:1px;
  height:1px;
  left:-10px;
  bottom:-10px;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
}

.youtube-box iframe{
  width:1px;
  height:1px;
  border:0;
}

/* MOBILE */
@media(max-width:700px){

  .nav{
    gap:10px;
  }

  .hero{
    padding-top:35px;
  }

  .hero h1{
    font-size:48px;
  }

  .hero .bengali{
    font-size:21px;
  }

  .hero p{
    font-size:15px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .card{
    min-height:160px;
    padding:18px;
  }

  .card h3{
    font-size:19px;
  }

  .player-inner{
    grid-template-columns:1fr;
    gap:5px;
  }

  .now{
    text-align:center;
  }

  .volume{
    display:none;
  }

  .controls{
    margin-bottom:3px;
  }

  main{
    padding-bottom:190px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🌺 AGOMANI</div>

    <button class="active" onclick="scrollToTop()">
      ⌂ Home
    </button>

    <button onclick="scrollToPlaylist()">
      ☷ Playlists
    </button>

    <button onclick="scrollToPlaylist()">
      ♪ Songs
    </button>
  </div>
</header>

<main>

<section class="hero">

  <div class="trishul">🔱</div>

  <h1>AGOMANI</h1>

  <div class="bengali">॥ মা আসছেন... ॥</div>

  <p>
    A musical celebration of Sharodiyo —
    Maa, Dhak & Devotion
  </p>

</section>


<section class="cards">

  <div class="card">
    <div class="emoji">🌺</div>
    <h3>AGOMANI</h3>
    <p>আগমনী গান</p>
    <button onclick="playSong(0)">▶</button>
  </div>

  <div class="card">
    <div class="emoji">🥁</div>
    <h3>DHAKER TAAL</h3>
    <p>ঢাকের তালে</p>
    <button onclick="playSong(1)">▶</button>
  </div>

  <div class="card">
    <div class="emoji">🎶</div>
    <h3>PUJOR GAAN</h3>
    <p>পুজোর বাংলা গান</p>
    <button onclick="playSong(2)">▶</button>
  </div>

  <div class="card">
    <div class="emoji">🌙</div>
    <h3>PUJO RAAT</h3>
    <p>রাতের সুর</p>
    <button onclick="playSong(0)">▶</button>
  </div>

</section>


<section class="section" id="playlist">

  <h2>🎵 AGOMANI Playlist</h2>

  <div id="songList"></div>

</section>

</main>


<!-- YOUTUBE PLAYER -->
<div class="youtube-box">
  <iframe
    id="youtubeFrame"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>


<!-- BOTTOM PLAYER -->
<div class="player">

  <div class="player-inner">

    <div class="now">
      <div class="now-title" id="nowTitle">
        Select a song
      </div>

      <div class="now-artist" id="nowArtist">
        Official YouTube player
      </div>
    </div>


    <div class="controls">

      <button class="control" onclick="previousSong()">
        ⏮
      </button>

      <button class="control play" onclick="togglePlay()" id="playButton">
        ▶
      </button>

      <button class="control" onclick="nextSong()">
        ⏭
      </button>

    </div>


    <div class="volume">
      🔊
      <input
        type="range"
        min="0"
        max="100"
        value="100"
        onchange="setVolume(this.value)">
    </div>

  </div>

</div>


<script>

/*
  SONG DATABASE

  এখানে শুধু OFFICIAL YouTube video ID দিতে হবে।

  Format:
  ["গানের নাম","শিল্পী","YouTube VIDEO ID"]
*/

const songs = [

  [
    "Bajlo Tomar Alor Benu",
    "Debolina Nandy • Bishakha Official",
    "FRJJSEG51jw"
  ],

  [
    "Ashilo Thakur",
    "Debayan Das • Official Artist Channel",
    "Xc9-W2gK9rE"
  ],

  [
    "Sharodo Gan",
    "Dola Banerjee • T-Series Bangla",
    "fSQl9H-SmU"
  ]

];


let current = 0;
let playing = false;


/* CREATE PLAYLIST */
function createPlaylist(){

  const list = document.getElementById("songList");

  list.innerHTML = "";

  songs.forEach((song,index)=>{

    const div = document.createElement("div");

    div.className = "song";

    div.innerHTML = `
      <div class="num">
        ${String(index+1).padStart(2,"0")}
      </div>

      <div>
        <div class="song-title">
          ${song[0]}
        </div>

        <div class="artist">
          ${song[1]}
        </div>
      </div>
    `;

    div.onclick = function(){
      playSong(index);
    };

    list.appendChild(div);

  });

}


/* PLAY SONG */
function playSong(index){

  current = index;

  const song = songs[current];

  document.getElementById("nowTitle").textContent = song[0];

  document.getElementById("nowArtist").textContent = song[1];

  /*
    YouTube embed URL
    autoplay=1 means user pressing Play will start it.
  */

  const url =
    "https://www.youtube.com/embed/" +
    song[2] +
    "?autoplay=1&enablejsapi=1&playsinline=1";

  document.getElementById("youtubeFrame").src = url;

  playing = true;

  document.getElementById("playButton").textContent = "⏸";

}


/* PLAY / PAUSE */
function togglePlay(){

  const frame = document.getElementById("youtubeFrame");

  if(!frame.src){

    playSong(current);

    return;
  }

  /*
    Reloading with autoplay toggles it back to playing.
    This keeps the player simple and reliable on mobile.
  */

  if(!playing){

    const song = songs[current];

    frame.src =
      "https://www.youtube.com/embed/" +
      song[2] +
      "?autoplay=1&enablejsapi=1&playsinline=1";

    playing = true;

    document.getElementById("playButton").textContent = "⏸";

  }else{

    /*
      Pause using YouTube iframe API command.
    */

    frame.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:"pauseVideo",
        args:[]
      }),
      "*"
    );

    playing = false;

    document.getElementById("playButton").textContent = "▶";

  }

}


/* NEXT */
function nextSong(){

  current++;

  if(current >= songs.length){
    current = 0;
  }

  playSong(current);

}


/* PREVIOUS */
function previousSong(){

  current--;

  if(current < 0){
    current = songs.length - 1;
  }

  playSong(current);

}


/* VOLUME */
function setVolume(value){

  const frame = document.getElementById("youtubeFrame");

  frame.contentWindow.postMessage(
    JSON.stringify({
      event:"command",
      func:"setVolume",
      args:[Number(value)]
    }),
    "*"
  );

}


/* SCROLL */
function scrollToPlaylist(){

  document.getElementById("playlist")
    .scrollIntoView({
      behavior:"smooth"
    });

}

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* START */
createPlaylist();

</script>

</body>
</html>
