<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGOMANI — Sharodiyo Bangla Music</title>

<style>
:root{
  --gold:#f4bd54;
  --red:#e83a2d;
  --bg:#080504;
  --card:#120b08;
  --line:rgba(255,211,140,.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  color:#fff;
  background:#080504;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.25)),
  url("durga-bg.png") center/cover fixed;
  z-index:-2;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:-1;
}

a{color:inherit;text-decoration:none}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(12,5,2,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

nav{
  display:flex;
  gap:28px;
  overflow:auto;
  padding:16px 20px;
  white-space:nowrap;
}

nav button{
  border:0;
  background:none;
  color:#fff;
  font-size:18px;
}

nav button.active{
  color:var(--gold);
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.hero{
  min-height:330px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero .trishul{
  font-size:60px;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:62px;
  letter-spacing:8px;
  margin:10px 0;
}

.hero .bengali{
  color:var(--gold);
  font-size:25px;
}

.hero p{
  font-size:19px;
  max-width:650px;
}

.listen{
  background:var(--red);
  color:white;
  border:0;
  border-radius:50px;
  padding:18px 35px;
  font-size:20px;
  font-weight:800;
  margin-top:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  background:rgba(18,11,8,.88);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  min-height:160px;
}

.card h3{
  font-size:25px;
  margin:10px 0;
}

.card p{
  color:#d8c8b4;
}

.play{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--gold);
  background:transparent;
  color:white;
  font-size:20px;
}

.section{
  margin-top:30px;
}

.section h2{
  font-family:Georgia,serif;
  font-size:28px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}

.search{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#100907;
  color:white;
  font-size:17px;
  margin-bottom:15px;
}

.song{
  display:flex;
  align-items:center;
  gap:15px;
  background:rgba(20,12,8,.9);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin:9px 0;
}

.num{
  color:var(--gold);
  min-width:32px;
  text-align:center;
}

.songinfo{
  flex:1;
}

.songtitle{
  font-weight:800;
  font-size:17px;
}

.meta{
  color:#c7b9a9;
  font-size:14px;
  margin-top:4px;
}

.song button{
  border:1px solid var(--gold);
  background:transparent;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
}

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(10,5,3,.96);
  border-top:1px solid var(--line);
  padding:12px 18px;
  z-index:20;
}

.playerbox{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.now{
  flex:1;
}

.now b{
  display:block;
  color:var(--gold);
}

.now small{
  color:#cbbdad;
}

.prev,.next{
  border:1px solid var(--gold);
  background:#180d08;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
}

iframe{
  display:none;
}

@media(max-width:700px){
  .hero h1{font-size:42px}
  .cards{grid-template-columns:1fr}
  nav{gap:20px}
  .song{padding:10px}
  .meta{font-size:12px}
}
</style>
</head>

let current=0;

function videoId(url){
  try{
    return new URL(url).searchParams.get("v");
  }catch(e){
    return "";
  }
}

function playSong(i){
  if(!songs[i]) return;

  current=i;

  const s=songs[i];

  document.getElementById("nowTitle").textContent=s.title;
  document.getElementById("nowArtist").textContent=
    s.singer+" • "+s.movie;

  const id=videoId(s.url);

  if(id){
    const start=s.start||0;

    document.getElementById("youtube").src=
      "https://www.youtube.com/embed/"+id+
      "?autoplay=1&start="+start+"&rel=0";
  }

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function render(){

  const q=document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const list=document.getElementById("songlist");

  const filtered=songs.filter(s=>
    s.title.toLowerCase().includes(q) ||
    s.singer.toLowerCase().includes(q) ||
    s.movie.toLowerCase().includes(q)
  );

  list.innerHTML=filtered.map((s,index)=>{

    const realIndex=songs.indexOf(s);

    return `
    <div class="song">

      <div class="num">
        ${String(realIndex+1).padStart(2,"0")}
      </div>

      <div class="songinfo">

        <div class="songtitle">
          ${s.title}
        </div>

        <div class="meta">
          🎤 ${s.singer} &nbsp; • &nbsp;
          🎬 ${s.movie}
        </div>

      </div>

      <button onclick="playSong(${realIndex})">
        ▶
      </button>

    </div>
    `;

  }).join("");
}

function next(){
  current=(current+1)%songs.length;
  playSong(current);
}

function prev(){
  current=(current-1+songs.length)%songs.length;
  playSong(current);
}

function filterSinger(text){
  document.getElementById("search").value=text;
  render();
  document.getElementById("songs").scrollIntoView({
    behavior:"smooth"
  });
}

render();

</script>

</body>
</html>
